[build]
  command = "npx expo export -p web"
  publish = "dist"

[build.environment]
  # Não é segredo (services/api.ts): a chave do Gemini vive só no servidor.
  EXPO_PUBLIC_API_URL = "https://aluma-backend-ydss.onrender.com"
  # Endereço do projeto, sem /rest/v1/: o supabase-js monta /auth/v1/... em cima dele.
  # Também vai dentro do app de qualquer jeito, e aqui vale para todo contexto de deploy.
  EXPO_PUBLIC_SUPABASE_URL = "https://flwqfpskluxavqwwaxsz.supabase.co"

# O site da develop fala com o backend da develop (serviço aluma-backend-develop no Render),
# para testar rota nova antes de ela chegar na main.
[context.develop.environment]
  EXPO_PUBLIC_API_URL = "https://aluma-backend-develop.onrender.com"

[[redirects]]
  from = "/*"
  to = "/+not-found.html"
  status = 404
